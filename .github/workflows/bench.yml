name: bench

# Manual-only trigger. Bench numbers from a shared GitHub Actions runner
# are noisy (~5–15% variance), but useful for relative comparison between
# `base85` and `base85-simd` on the same hardware, and for first-pass
# validation that an x86 SIMD path actually beats scalar without needing
# dedicated metal.
#
# Run via:
#   gh workflow run bench --ref <branch-or-sha>
# or from the Actions tab in the GitHub UI.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to bench (defaults to the workflow's ref)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bench:
    name: cargo bench (ubuntu x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Hardware / feature inventory
        run: |
          echo "=== CPU ==="
          lscpu | grep -E "^(Model name|Vendor ID|CPU\(s\)|CPU max MHz|CPU MHz|Caches|L[123])" || true
          echo
          echo "=== SIMD features available ==="
          grep -oE '\b(sse[0-9._]*|ssse3|avx[0-9_]*)\b' /proc/cpuinfo \
            | sort -u | tr '\n' ' '
          echo

      # Guard: the bench numbers from this workflow are the only x86 perf
      # data we have until we get dedicated metal. If GitHub ever rotates
      # the runner fleet to hardware without SSE4.1/SSSE3/AVX2 (extremely
      # unlikely — those have been universal x86 server features since
      # ~2013), the SIMD path would silently fall back to scalar inside
      # the crate's runtime feature gate and the comparison would
      # become apples-to-apples scalar vs scalar. Fail loudly instead.
      - name: Require SSE4.1 + SSSE3 + AVX2
        run: |
          missing=()
          for feat in sse4_1 ssse3 avx2; do
            if ! grep -q "\b${feat}\b" /proc/cpuinfo; then
              missing+=("${feat}")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Required CPU features missing on this runner: ${missing[*]}."
            echo "::error::Bench would silently fall back to scalar; aborting."
            exit 1
          fi
          echo "All required features present."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo bench
        run: cargo bench --bench encode --locked 2>&1 | tee bench-output.txt

      - name: Summary table
        if: always()
        run: |
          echo "## Encode/decode timings"
          grep -E '^(encode|decode)/(base85|base85_simd)/' bench-output.txt \
            | grep 'time:' || true

      - name: Upload raw output + criterion HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-output.txt
            target/criterion/
          if-no-files-found: error
          retention-days: 30
