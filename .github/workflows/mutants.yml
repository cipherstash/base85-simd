name: Mutants

# Gates PRs on mutation testing of the lines they change. cargo-mutants rewrites
# small pieces of logic (flip `<` to `<=`, replace a body with `()`, …) and
# reruns the tests; a mutant that survives is a line the suite does not
# actually pin down. Here that is the chunk-loop guards, offset arithmetic and
# tail handling around the SIMD kernels.
#
# Scoped with `--in-diff` to the PR's own changes, so the gate trips only when a
# PR adds (or moves) logic its tests don't exercise. Three cases sweep the
# whole crate instead (~130 mutants per arch):
#
# - a PR that changes the mutants setup (this workflow, .cargo/mutants.toml or
#   scripts/mutants.sh), whose excludes can hide mutants anywhere;
# - a PR that changes src/ or tests/ but whose changed lines yield no
#   mutants (a rename, a moved function, a deleted test), which would
#   otherwise pass without testing anything;
# - a manual dispatch.
#
# Locally, `mise run mutants` sweeps the whole crate.
#
# Runs on both arches: the NEON dispatch only compiles on aarch64 and the AVX2
# dispatch and scalar fallback only on x86_64. cargo-mutants doesn't evaluate
# `#[cfg]`, so scripts/mutants.sh excludes the other arch's code, whose
# mutants would otherwise "survive" because they aren't compiled at all.
# Excludes that hold on every arch, and timeouts, live in .cargo/mutants.toml.
#
# Adapted from vitaminc's gate, minus three things that don't apply here:
# - The toolchain is `@stable`, not pinned: vitaminc pins because its
#   trybuild snapshots record one compiler's wording, and this crate has none.
#   ci.yml tests on stable too.
# - There's no `changes` job: this workflow has no path filter, so it always
#   reports and can be a required check as is.
# - Actions are on the same major versions as ci.yml.
#
# To soften to report-only, drop the "Enforce" step; the sticky comment keeps
# working either way. To block merges, mark both "Mutants gate" checks as
# required in the repo's branch-protection settings.
on:
  pull_request:
  workflow_dispatch:

# Needed to post/update the report comment on the PR.
permissions:
  contents: read
  pull-requests: write

# Cancel an in-flight run when the PR is pushed again — only the latest matters.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants gate / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # A whole-crate sweep (~150 mutants per arch) takes well under two hours
    # at `-j 2`; a diff-scoped run, minutes. Either still going after two
    # hours is stuck, so fail it rather than hold the runner for GitHub's
    # 6-hour default.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: macos-latest
          - arch: x86_64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The diff for `--in-diff` needs the test merge commit's parents.
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        # Prebuilt binary via cargo-binstall — far faster than `cargo install`.
        # GITHUB_TOKEN lifts the anonymous API rate limit binstall would hit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-mutants

      - name: Compute PR diff
        id: diff
        # The checkout is GitHub's test merge of the PR into its base, so its
        # first parent is the base commit this tree was built on. Diff against
        # that rather than `github.base_ref`, which can be stale if the PR was
        # retargeted. PR-only: a manual dispatch sweeps the whole crate.
        #
        #
        # Two cases sweep the whole crate instead (see the header): a change
        # to the mutants setup, and a change to src/ or tests/ whose changed
        # lines yield no mutants.
        if: github.event_name == 'pull_request'
        run: |
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
            echo "::error::Expected the PR's test merge commit at HEAD; got $(git rev-parse HEAD)."
            exit 1
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qxE '\.cargo/mutants\.toml|\.github/workflows/mutants\.yml|scripts/mutants\.sh' <<<"$changed"; then
            echo "Mutants setup changed: sweeping the whole crate."
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff HEAD^1 HEAD > pr.diff
          if grep -qE '^(src|tests)/' <<<"$changed"; then
            n=$(scripts/mutants.sh --list --in-diff pr.diff | grep -c . || true)
            if [ "$n" -eq 0 ]; then
              echo "Rust changes yield no mutants on their own lines: sweeping the whole crate."
              echo "scope=full" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "scope=diff" >> "$GITHUB_OUTPUT"
          echo "Changed lines under mutation:"
          cat pr.diff

      - name: Run cargo-mutants
        id: mutants
        # Don't fail here: the Enforce step is authoritative, and the sticky
        # comment must be posted first.
        continue-on-error: true
        run: |
          set +e
          if [ "${{ steps.diff.outputs.scope }}" = "diff" ]; then
            scripts/mutants.sh --no-shuffle -vV -j 2 --in-diff pr.diff
          else
            scripts/mutants.sh --no-shuffle -vV -j 2
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build mutants report
        if: always()
        run: |
          out=mutants.out
          count() { if [ -f "$out/$1" ]; then grep -c . "$out/$1" || true; else echo 0; fi; }
          caught=$(count caught.txt)
          missed=$(count missed.txt)
          unviable=$(count unviable.txt)
          timeout=$(count timeout.txt)
          {
            echo '<!-- cargo-mutants-report-${{ matrix.arch }} -->'
            if [ "${{ steps.diff.outputs.scope }}" = "diff" ]; then scope='`--in-diff`'; else scope='whole crate'; fi
            echo "## Mutation testing — ${{ matrix.arch }} (cargo-mutants, $scope)"
            echo
            if [ ! -d "$out" ]; then
              # No output dir: either nothing to mutate (exit 0) or the run
              # died before producing results (e.g. the baseline failed).
              if [ "${{ steps.mutants.outputs.exit_code }}" = "0" ]; then
                echo "No mutants were generated for the changed lines."
              else
                echo "**Warning:** cargo-mutants did not complete (exit ${{ steps.mutants.outputs.exit_code }}) before producing results — check the workflow run logs."
              fi
              exit 0
            fi
            echo "| caught | missed | unviable | timeout |"
            echo "| -----: | -----: | -------: | ------: |"
            echo "| $caught | $missed | $unviable | $timeout |"
            echo
            if [ "$missed" -gt 0 ] || [ "$timeout" -gt 0 ]; then
              echo "### Surviving mutants — add a test that fails on each before merging"
              echo '```'
              [ -s "$out/missed.txt" ] && cat "$out/missed.txt"
              [ -s "$out/timeout.txt" ] && { echo '# timed out (treated as surviving):'; cat "$out/timeout.txt"; }
              echo '```'
            elif [ "${{ steps.mutants.outputs.exit_code }}" = "0" ]; then
              echo "Every mutant was caught by a test."
            else
              echo "**Warning:** cargo-mutants exited ${{ steps.mutants.outputs.exit_code }} with no surviving mutants recorded — check the workflow run logs."
            fi
          } > mutants-comment.md
          cat mutants-comment.md

      - name: Post mutants report as a sticky PR comment
        # Best-effort: a comment hiccup must not turn the gate red.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('mutants-comment.md', 'utf8');
            const marker = '<!-- cargo-mutants-report-${{ matrix.arch }} -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce — fail on surviving mutants
        run: |
          out=mutants.out
          if [ -s "$out/missed.txt" ] || [ -s "$out/timeout.txt" ]; then
            echo "::error::Surviving mutants — add tests that catch them (see the PR comment)."
            [ -s "$out/missed.txt" ] && cat "$out/missed.txt"
            [ -s "$out/timeout.txt" ] && cat "$out/timeout.txt"
            exit 1
          fi
          # Only 0 (all caught), 2 (missed) and 3 (timeouts) mean the sweep
          # completed, and 2/3 are enforced above. Anything else — 4 (the
          # unmutated baseline failed), 70 (internal error), an OOM kill —
          # means it did not.
          case "${{ steps.mutants.outputs.exit_code }}" in
            0|2|3) ;;
            *)
              echo "::error::cargo-mutants did not complete (exit ${{ steps.mutants.outputs.exit_code }}) — check the run logs."
              exit 1
              ;;
          esac
          echo "No surviving mutants."
