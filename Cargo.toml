[package]
name = "base85-simd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast base85 (RFC 1924 / Z85-style) encoder and decoder, with a NEON SIMD encode path on aarch64."
license = "MIT OR Apache-2.0"
repository = "https://github.com/cipherstash/base85-simd"
readme = "README.md"
keywords = ["base85", "ascii85", "simd", "neon", "encoding"]
categories = ["encoding"]
exclude = ["*.xlsx", ".DS_Store", "mise.toml"]

[dependencies]

[dev-dependencies]
quickcheck = "1.0.3"
base85 = "2.0.0"
criterion = { version = "0.6.0", features = ["html_reports"] }

[[bench]]
name = "encode"
harness = false
